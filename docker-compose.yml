services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api:
    build: .
    container_name: fraud-api
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    working_dir: /home/kaya1122/fraud-mlops-project
    volumes:
      - .:/home/kaya1122/fraud-mlops-project
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  producer:
    build: .
    container_name: fraud-producer
    depends_on:
      - kafka
    working_dir: /home/kaya1122/fraud-mlops-project
    volumes:
      - .:/home/kaya1122/fraud-mlops-project
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "streaming/producer.py"]
    restart: always

  consumer:
    build: .
    container_name: fraud-consumer
    depends_on:
      - kafka
      - api
    working_dir: /home/kaya1122/fraud-mlops-project
    volumes:
      - .:/home/kaya1122/fraud-mlops-project
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_URL: http://api:8000/predict
    command: ["python", "streaming/consumer.py"]
    restart: always

  mlflow:
    build: .
    container_name: mlflow
    working_dir: /home/kaya1122/fraud-mlops-project
    volumes:
      - .:/home/kaya1122/fraud-mlops-project
    ports:
      - "5000:5000"
    command:
      - sh
      - -c
      - |
        mlflow ui \
          --backend-store-uri sqlite:///mlflow.db \
          --host 0.0.0.0 \
          --port 5000 \
          --serve-artifacts \
          --allowed-hosts '*'
        --serve-artifacts \
        --allowed-hosts '*'