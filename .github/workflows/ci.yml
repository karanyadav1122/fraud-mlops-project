name: CI

on:
  push:
    branches:
      - main
      - develop
      - '**'

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 httpx

      - name: Lint
        run: |
          flake8 api training monitoring streaming spark --max-line-length=120

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Validate Docker build
        run: |
          docker build -t fraud-mlops-project:test .